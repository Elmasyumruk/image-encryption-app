<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}IEA{% endblock %}</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:#0f0f1a;color:#e0e0e0;min-height:100vh}
    a{color:#7eb8f7;text-decoration:none}
    .btn{display:inline-block;padding:8px 18px;border-radius:6px;border:none;cursor:pointer;font-size:14px;transition:.2s}
    .btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
    .btn-danger{background:#dc2626;color:#fff}.btn-danger:hover{background:#b91c1c}
    .btn-success{background:#16a34a;color:#fff}.btn-success:hover{background:#15803d}
    .card{background:#1a1a2e;border:1px solid #2d2d4e;border-radius:10px;padding:20px}
    .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px}
    .badge-online{background:#166534;color:#86efac}
    .badge-text{background:#2e1a4e;color:#c4b5fd}
    .badge-offline{background:#3f3f46;color:#a1a1aa}
    .badge-info{background:#1e3a5f;color:#93c5fd}
    input,select,textarea{background:#0f0f1a;border:1px solid #2d2d4e;color:#e0e0e0;
      padding:8px 12px;border-radius:6px;font-size:14px;width:100%}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#2563eb}
    label{display:block;margin-bottom:4px;font-size:13px;color:#9ca3af}
    .form-group{margin-bottom:14px}
    .alert{padding:10px 14px;border-radius:6px;margin-bottom:12px;font-size:13px}
    .alert-error{background:#450a0a;border:1px solid #991b1b;color:#fca5a5}
    .alert-success{background:#052e16;border:1px solid #166534;color:#86efac}
    nav{background:#16162a;border-bottom:1px solid #2d2d4e;padding:12px 24px;
        display:flex;justify-content:space-between;align-items:center}
    nav .brand{font-size:18px;font-weight:700;color:#7eb8f7;letter-spacing:.5px}
    nav .nav-right{display:flex;gap:12px;align-items:center}
    .tag{font-size:11px;background:#1e3a5f;color:#93c5fd;padding:2px 8px;border-radius:10px}
  </style>
  {% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
