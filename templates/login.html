{% extends "base.html" %}
{% block title %}IEA – Login{% endblock %}
{% block body %}
<div style="display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px">
  <div class="card" style="width:100%;max-width:400px">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:36px;margin-bottom:8px">🔐</div>
      <h1 style="font-size:22px;color:#7eb8f7">Image Encryption App</h1>
      <p style="font-size:13px;color:#6b7280;margin-top:4px">Secure encrypted communication</p>
    </div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label>Username</label>
        <input name="username" type="text" placeholder="Enter username" required autofocus/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input name="password" type="password" placeholder="Enter password" required/>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:4px">Sign In</button>
    </form>

    <p style="text-align:center;margin-top:16px;font-size:13px;color:#6b7280">
      No account? <a href="/register">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
