{% extends "base.html" %}
{% block title %}IEA – Register{% endblock %}
{% block body %}
<div style="display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px">
  <div class="card" style="width:100%;max-width:420px">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:36px;margin-bottom:8px">🛡️</div>
      <h1 style="font-size:22px;color:#7eb8f7">Create Account</h1>
      <p style="font-size:13px;color:#6b7280;margin-top:4px">RSA-2048 key pair generated automatically</p>
    </div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <input type="hidden" name="public_key" value=""/>
      <div class="form-group">
        <label>Username</label>
        <input name="username" type="text" placeholder="Choose a username" required autofocus/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input name="password" type="password" placeholder="Choose a password" required/>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:4px">Register</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:13px;color:#6b7280">
      Already have an account? <a href="/login">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
